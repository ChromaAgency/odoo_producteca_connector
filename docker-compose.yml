services:
  web16:
    build:
      context: .
      dockerfile: DockerFile
    depends_on:
      - mydb16
    ports:
      - "8088:8069"
    environment:
      - HOST=mydb
      - USER=odoo
      - PASSWORD=myodoo
    volumes:
      - odoo-web-data16:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./:/mnt/extra-addons/
      - ${ENTERPRISE_PATH}:/mnt/enterprise-addons
    command: odoo --dev all,xml,reload -s
    restart: always
  mydb16:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=myodoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data16:/var/lib/postgresql/data/pgdata
volumes:
  odoo-web-data16:
  odoo-db-data16: